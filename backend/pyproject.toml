[project]
name = "ai-hr-assistant"
version = "0.1.0"
description = "AI-powered HR Assistant"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.14.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "python-multipart>=0.0.9",
    "minio>=7.2.0",
    "httpx>=0.27.0",
    "pdfplumber>=0.11.0",
    "python-docx>=1.1.0",
    "cryptography>=42.0.0",
    "PyJWT>=2.8.0",
    "aiosmtplib>=3.0.0",
    "email-validator>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# B008: Depends()/require_role() in FastAPI argument defaults is the idiomatic pattern.
# DTZ011: date.today() is fine for demo seeds.
# UP017: datetime.timezone.utc is clearer than datetime.UTC here.
ignore = ["B008", "DTZ011", "UP017"]