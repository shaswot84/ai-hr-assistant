[project]
name = "ai-hr-assistant"
version = "0.1.0"
description = "AI-powered HR Assistant"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.14.0",
    "python-dotenv>=1.0.0",
    "pydantic-settings>=2.0.0",
    "pgvector>=0.3.0",
    "asyncpg>=0.29.0",
    "httpx>=0.27.0",
    "firecrawl-anydoc>=0.1.3",
    "minio>=7.2.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]
# In-process cross-encoder reranker (BAAI/bge-reranker-base). Heavy (torch);
# kept optional so the base install stays lean.
reranker = [
    "sentence-transformers>=3.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
