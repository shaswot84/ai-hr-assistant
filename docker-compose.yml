# Core stack for the AI HR Assistant MVP (ingestion pipeline + auth/recruitment).
#
# Redis backs the chat leave-agent session store (REDIS_URL) so staged
# confirmations and the execution claim are shared across worker processes;
# the app only uses it when REDIS_URL is set. Ollama (local embeddings) is
# opt-in behind the `local-models` profile because it pulls ~2.5 GB of model
# weights; by default the backend/worker reuse an Ollama already running on
# the host via host.docker.internal.
#
#   docker compose up -d --build                # full stack
#   docker compose --profile local-models up -d # + ollama in Docker
#   ollama pull nomic-embed-text                # first run (native or docker compose exec ollama ...)
#
# Host ports are overridable via .env (see .env.example). The defaults avoid
# clashing with other local services.

services:
  postgres:
    # pgvector must be available for the Knowledge Service migration
    # (`CREATE EXTENSION vector`); plain postgres images don't ship it.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: hr_assistant
      POSTGRES_USER: hr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hr}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hr -d hr_assistant"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9100}:9000"   # S3 API (backend/worker use http://minio:9000)
      - "${MINIO_CONSOLE_PORT:-9101}:9001"   # admin console (browser only)
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  # Redis: backs the chat leave-agent session store (REDIS_URL) so staged
  # confirmations and the execution claim are shared across worker processes.
  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"]
    env_file:
      - .env
    environment:
      # asyncpg driver: unified async SQLAlchemy database engine (db/session.py)
      # used across all capabilities, repositories, services, agents, and Alembic.
      DATABASE_URL: postgresql+asyncpg://hr:${POSTGRES_PASSWORD:-hr}@postgres:5432/hr_assistant
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: hr-documents
      MINIO_SECURE: "false"
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      AUTH_PROVIDER: jwt
      OLLAMA_URL: http://host.docker.internal:11434
      INGESTION_POLL_INTERVAL_SECONDS: "5"
      # Redis-backed chat session store (multi-worker safe) when set.
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      # In-process cross-encoder reranker (BAAI/bge-reranker-base). The model
      # weights download from HuggingFace on first search into the HF cache
      # volume below, so the download survives container recreates.
      RERANKER_ENABLED: "false"
      RERANKER_MODEL: BAAI/bge-reranker-base
      # Generation LLM (Ollama Cloud) for polished answers from retrieved chunks.
      LLM_ENABLED: ${LLM_ENABLED:-true} #was false
      LLM_URL: ${LLM_URL:-https://ollama.com}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-oss:120b-cloud}
      # Retrieval funnel: fetch 30 candidates per leg, rerank 5, gate at 0.55.
      RETRIEVAL_TOP_K: "15"
      RETRIEVAL_RERANK_TOP_N: "5"
      RETRIEVAL_CONFIDENCE_THRESHOLD: "0.4"
    volumes:
      - ./backend/src:/app/src
      - ./backend/alembic:/app/alembic
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
      # Manager-editable settings (LLM route/model/key, resume-review prompt)
      # are read AND written directly from this file — read-write only here,
      # since the backend API is the only writer (workers below mount :ro).
      - ./.env:/app/.env
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Ingestion pipeline worker (Knowledge Service): claims ingestion_job rows
  # and runs validate -> parse -> normalize -> chunk -> embed -> persist.
  worker:
    build: ./backend
    command: ["python", "-m", "app.jobs.ingestion_worker"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://hr:${POSTGRES_PASSWORD:-hr}@postgres:5432/hr_assistant
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: hr-documents
      MINIO_SECURE: "false"
      OLLAMA_URL: http://host.docker.internal:11434
      INGESTION_POLL_INTERVAL_SECONDS: "5"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  # Recruitment/auth outbox worker (AI resume scoring + notification emails).
  # Separate service/name from `worker` above since they run different loops
  # off the same backend image.
  recruitment_worker:
    build: ./backend
    command: ["python", "-m", "app.jobs.worker"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://hr:${POSTGRES_PASSWORD:-hr}@postgres:5432/hr_assistant
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: hr-documents
      MINIO_SECURE: "false"
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      AUTH_PROVIDER: jwt
    volumes:
      - ./backend/src:/app/src
      # Read-only: this worker reads the manager-editable LLM/prompt
      # settings on every job, but only the backend API writes them.
      - ./.env:/app/.env:ro
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:${BACKEND_HOST_PORT:-8000}
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

  # Optional: local embedding model (nomic-embed-text, 768-dim, ~2.5 GB).
  # Enable with: docker compose --profile local-models up -d
  ollama:
    image: ollama/ollama
    profiles: ["local-models"]
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollamadata:/root/.ollama

volumes:
  pgdata:
  miniodata:
  frontend_node_modules:
  ollamadata:
