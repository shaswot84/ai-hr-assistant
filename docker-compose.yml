services:
  postgres:
    # pgvector must be available for the Knowledge Service migration
    # (`CREATE EXTENSION vector`); plain postgres:17-alpine doesn't ship it.
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: hr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hr-dev-password}
      POSTGRES_DB: hr
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hr -d hr"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  backend:
    build: ./backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    env_file:
      - .env
    environment:
      # asyncpg driver: this is the single DATABASE_URL both the async
      # Knowledge Service engine (db/session.py) and Alembic use directly;
      # the sync recruitment/auth engine (db/sync_session.py) derives its
      # own +psycopg2 URL from this one at import time.
      DATABASE_URL: postgresql+asyncpg://hr:${POSTGRES_PASSWORD:-hr-dev-password}@postgres:5432/hr
      MINIO_ENDPOINT: minio:9000
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      AUTH_PROVIDER: jwt
    ports:
      - "8000:8000"
    volumes:
      - ./backend/src:/app/src
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker:
    build: ./backend
    command: ["python", "-m", "app.jobs.worker"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://hr:${POSTGRES_PASSWORD:-hr-dev-password}@postgres:5432/hr
      MINIO_ENDPOINT: minio:9000
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      AUTH_PROVIDER: jwt
    volumes:
      - ./backend/src:/app/src
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
  miniodata:
  frontend_node_modules:
